<!doctype html>
<meta charset="utf-8">
<title>Accountant's Desk</title>
<style>
@font-face{font-family:Mont;font-weight:100 900;src:url(fonts/Montserrat-var.woff2) format('woff2')}
@font-face{font-family:Tape;font-weight:400;src:url(fonts/CourierPrime-400.woff2) format('woff2')}
@font-face{font-family:Tape;font-weight:700;src:url(fonts/CourierPrime-700.woff2) format('woff2')}
@font-face{font-family:Hand;font-weight:600;src:url(fonts/Caveat-600.woff2) format('woff2')}
html,body{margin:0;background:#111}canvas{display:block;max-width:100vw;margin:auto}
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// "Accountant's Desk" design test for Tax Secrets Canada.
// Top-down desk; the camera is a 2D transform over a 3840x2160 world. window.seek(t) paints frame t.
// Every figure on screen is a PLACEHOLDER for the design test; nothing here is verified tax data.
const OW = 1920, OH = 1080, WW = 3840, WH = 2160;
const GREEN = '#27AE60', ORANGE = '#F39C12', CHAR = '#1A1A1A', INK = '#2b2a28', PAPER = '#fbf8ef';
const g = document.getElementById('c').getContext('2d');

// ---------- motion ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
function spring(t, k = 170, d = 26) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k), z = d / (2 * w0);
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
}
// value with several targets = one spring per change (keys: [[time, value], ...])
function track(t, keys, k = 40, d = 13) {
  let v = keys[0][1];
  for (let i = 1; i < keys.length; i++) v += (keys[i][1] - keys[i - 1][1]) * spring(t - keys[i][0], k, d);
  return v;
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ease = (p) => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function shadowed(c, blur, ox, oy, a, fn) {
  c.save(); c.shadowColor = `rgba(20,10,0,${a})`; c.shadowBlur = blur; c.shadowOffsetX = ox; c.shadowOffsetY = oy; fn(); c.restore();
}

// ---------- objects on the desk (world coords; rot in radians) ----------
const TABLET = { x: 620, y: 300, w: 1720, h: 1190, rot: -0.025 };
const CALC = { x: 2640, y: 1170, w: 760, h: 900, rot: 0.045 };
const PAD = { x: 150, y: 1330, w: 560, h: 740, rot: -0.1 };
const toWorld = (o, lx, ly) => [o.x + lx * Math.cos(o.rot) - ly * Math.sin(o.rot), o.y + lx * Math.sin(o.rot) + ly * Math.cos(o.rot)];
const inObj = (c, o, fn) => { c.save(); c.translate(o.x, o.y); c.rotate(o.rot); fn(); c.restore(); };

function wood(c) {
  const r = rng(3);
  const base = c.createLinearGradient(0, 0, WW, WH);
  base.addColorStop(0, '#caa274'); base.addColorStop(1, '#ad8256');
  c.fillStyle = base; c.fillRect(0, 0, WW, WH);
  const PH = 432;
  for (let p = 0; p < WH / PH; p++) {
    const y0 = p * PH;
    c.save(); c.beginPath(); c.rect(0, y0, WW, PH); c.clip();
    c.fillStyle = r() < 0.5 ? `rgba(255,235,205,${0.03 + r() * 0.05})` : `rgba(60,30,10,${0.03 + r() * 0.06})`;
    c.fillRect(0, y0, WW, PH);
    for (let i = 0; i < 90; i++) {
      const y = y0 + r() * PH, amp = 2 + r() * 12, f = 0.0008 + r() * 0.003, ph = r() * 6.28;
      c.strokeStyle = `rgba(75,42,15,${0.04 + r() * 0.12})`; c.lineWidth = 0.6 + r() * 2.4;
      c.beginPath();
      for (let x = 0; x <= WW; x += 24) {
        const yy = y + Math.sin(x * f + ph) * amp + Math.sin(x * f * 3.3 + ph * 2) * amp * 0.3;
        x ? c.lineTo(x, yy) : c.moveTo(x, yy);
      }
      c.stroke();
    }
    c.restore();
    c.fillStyle = 'rgba(45,22,6,0.4)'; c.fillRect(0, y0, WW, 3);
    c.fillStyle = 'rgba(255,240,220,0.14)'; c.fillRect(0, y0 + 3, WW, 2);
  }
  // window light from top-left, falloff to the corners
  const L = c.createRadialGradient(WW * 0.32, WH * 0.25, 200, WW * 0.45, WH * 0.45, WW * 0.75);
  L.addColorStop(0, 'rgba(255,245,225,0.22)'); L.addColorStop(1, 'rgba(30,15,0,0.38)');
  c.fillStyle = L; c.fillRect(0, 0, WW, WH);
}

function tabletBody(c) {
  inObj(c, TABLET, () => {
    shadowed(c, 90, 30, 50, 0.45, () => { rr(c, 0, 0, TABLET.w, TABLET.h, 70); c.fillStyle = '#0d0d0e'; c.fill(); });
    rr(c, 2, 2, TABLET.w - 4, TABLET.h - 4, 68); c.lineWidth = 4; c.strokeStyle = 'rgba(255,255,255,0.10)'; c.stroke();
    c.beginPath(); c.arc(TABLET.w / 2, 26, 7, 0, 7); c.fillStyle = '#222'; c.fill();
  });
}

function calcBody(c) {
  inObj(c, CALC, () => {
    const { w, h } = CALC;
    shadowed(c, 70, 25, 40, 0.5, () => { rr(c, 0, 0, w, h, 60); c.fillStyle = '#2c2e33'; c.fill(); });
    const gl = c.createLinearGradient(0, 0, 0, h); gl.addColorStop(0, 'rgba(255,255,255,0.10)'); gl.addColorStop(1, 'rgba(0,0,0,0.15)');
    rr(c, 0, 0, w, h, 60); c.fillStyle = gl; c.fill();
    // paper slot + roll housing
    rr(c, 80, 18, 600, 44, 18); c.fillStyle = '#16171a'; c.fill();
    // LCD frame
    rr(c, 56, 100, w - 112, 170, 22); c.fillStyle = '#17181b'; c.fill();
    const keys = [['C', 'M+', 'M−', 'TAX'], ['7', '8', '9', '÷'], ['4', '5', '6', '×'], ['1', '2', '3', '−'], ['0', '.', '=', '+']];
    const kw = 146, kh = 100, gx = 26, gy = 22, x0 = 56, y0 = 310;
    keys.forEach((row, r) => row.forEach((k, i) => {
      const x = x0 + i * (kw + gx), y = y0 + r * (kh + gy);
      const op = i === 3 || r === 0, fill = k === '=' ? ORANGE : k === 'TAX' ? GREEN : op ? '#4a4d54' : '#e9e6df';
      rr(c, x, y + 8, kw, kh, 22); c.fillStyle = 'rgba(0,0,0,0.45)'; c.fill();
      rr(c, x, y, kw, kh, 22); c.fillStyle = fill; c.fill();
      const kg = c.createLinearGradient(0, y, 0, y + kh); kg.addColorStop(0, 'rgba(255,255,255,0.18)'); kg.addColorStop(1, 'rgba(0,0,0,0.12)');
      rr(c, x, y, kw, kh, 22); c.fillStyle = kg; c.fill();
      c.fillStyle = fill === '#e9e6df' ? '#222' : '#fff';
      c.font = `700 ${k.length > 2 ? 30 : 44}px Mont`; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(k, x + kw / 2, y + kh / 2 + 2);
    }));
  });
}

function coffee(c) {
  const x = 330, y = 330;
  shadowed(c, 60, 20, 30, 0.45, () => { c.beginPath(); c.arc(x, y, 230, 0, 7); c.fillStyle = '#f2efe9'; c.fill(); });
  c.beginPath(); c.arc(x, y, 230, 0, 7); c.lineWidth = 6; c.strokeStyle = 'rgba(0,0,0,0.06)'; c.stroke();
  shadowed(c, 30, 10, 16, 0.35, () => { c.beginPath(); c.arc(x, y, 150, 0, 7); c.fillStyle = '#fbfaf7'; c.fill(); });
  // handle
  c.save(); c.translate(x, y); c.rotate(0.6); rr(c, 140, -34, 90, 68, 34); c.lineWidth = 22; c.strokeStyle = '#f6f4f0'; c.stroke(); c.restore();
  const cg = c.createRadialGradient(x - 30, y - 30, 10, x, y, 130);
  cg.addColorStop(0, '#6b4126'); cg.addColorStop(1, '#3a210f');
  c.beginPath(); c.arc(x, y, 124, 0, 7); c.fillStyle = cg; c.fill();
  c.beginPath(); c.ellipse(x - 40, y - 45, 38, 16, -0.6, 0, 7); c.fillStyle = 'rgba(255,240,220,0.18)'; c.fill();
}

function notepad(c) {
  inObj(c, PAD, () => {
    const { w, h } = PAD;
    shadowed(c, 50, 18, 26, 0.4, () => { c.fillStyle = '#f7e27e'; c.fillRect(0, 0, w, h); });
    c.fillStyle = '#5b5f66'; c.fillRect(0, 0, w, 70);
    for (let y = 150; y < h - 20; y += 52) { c.fillStyle = 'rgba(70,110,170,0.35)'; c.fillRect(0, y, w, 2); }
    c.fillStyle = 'rgba(200,60,60,0.5)'; c.fillRect(84, 70, 3, h - 70);
    c.fillStyle = '#2d3a6b'; c.font = '600 54px Hand'; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.fillText('RRSP → RRIF ?', 104, 192);
    c.fillText('age 71 — by Dec 31', 104, 244);
    c.fillText('options: 1 · 2 · 3', 104, 296);
    c.strokeStyle = '#2d3a6b'; c.lineWidth = 4; c.beginPath(); c.ellipse(300, 236, 230, 40, -0.03, 0, 7); c.stroke();
  });
  // pen
  c.save(); c.translate(820, 1620); c.rotate(-1.05);
  shadowed(c, 20, 10, 14, 0.4, () => { rr(c, -320, -16, 640, 32, 16); c.fillStyle = '#1d2b4f'; c.fill(); });
  c.fillStyle = '#c9a44a'; c.fillRect(170, -16, 30, 32); c.fillStyle = '#d6d6d6';
  c.beginPath(); c.moveTo(320, -12); c.lineTo(380, 0); c.lineTo(320, 12); c.fill(); c.restore();
}

let STATIC = null, WOOD = null, GRAIN = null;
function buildStatic() {
  WOOD = document.createElement('canvas'); WOOD.width = WW; WOOD.height = WH; wood(WOOD.getContext('2d'));
  STATIC = document.createElement('canvas'); STATIC.width = WW; STATIC.height = WH;
  const c = STATIC.getContext('2d'); c.drawImage(WOOD, 0, 0);
  coffee(c); notepad(c); tabletBody(c); calcBody(c);
  GRAIN = document.createElement('canvas'); GRAIN.width = 512; GRAIN.height = 512;
  const gc = GRAIN.getContext('2d'), r = rng(9), img = gc.createImageData(512, 512);
  for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 14; }
  gc.putImageData(img, 0, 0);
}

// ---------- dynamic parts ----------
function tabletScreen(c, t) {
  inObj(c, TABLET, () => {
    const sx = 52, sy = 52, sw = TABLET.w - 104, sh = TABLET.h - 104;
    c.save(); rr(c, sx, sy, sw, sh, 30); c.clip();
    const bg = c.createLinearGradient(sx, sy, sx + sw, sy + sh); bg.addColorStop(0, '#1f2120'); bg.addColorStop(1, CHAR);
    c.fillStyle = bg; c.fillRect(sx, sy, sw, sh);
    c.strokeStyle = 'rgba(255,255,255,0.035)'; c.lineWidth = 2;
    for (let x = sx; x < sx + sw; x += 80) { c.beginPath(); c.moveTo(x, sy); c.lineTo(x, sy + sh); c.stroke(); }
    for (let y = sy; y < sy + sh; y += 80) { c.beginPath(); c.moveTo(sx, y); c.lineTo(sx + sw, y); c.stroke(); }
    const X = sx + 110;
    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    rr(c, X, sy + 90, 44, 44, 10); c.fillStyle = GREEN; c.fill();
    c.fillStyle = '#fff'; c.font = '800 30px Mont'; c.fillText('$', X + 13, sy + 124);
    c.fillStyle = GREEN; c.font = '700 32px Mont'; c.fillText('TAX SECRETS CANADA', X + 66, sy + 125);
    const p1 = spring(t - 0.3, 120, 22), p2 = spring(t - 0.6, 120, 22);
    c.globalAlpha = clamp(p1 * 2); c.fillStyle = '#f4f2ec'; c.font = '800 104px Mont';
    c.fillText('What happens to your', X, sy + 300 + (1 - p1) * 40);
    c.globalAlpha = clamp(p2 * 2);
    c.fillText('RRSP at', X, sy + 500 + (1 - p2) * 40);
    const w = c.measureText('RRSP at ').width;
    c.fillStyle = GREEN; c.font = '900 190px Mont'; c.fillText('71', X + w, sy + 515 + (1 - p2) * 40);
    c.fillStyle = '#f4f2ec'; c.font = '800 104px Mont'; c.fillText('?', X + w + c.measureText('71').width * 1.84, sy + 500 + (1 - p2) * 40);
    c.globalAlpha = 1;
    ['Convert to a RRIF', 'Buy an annuity', 'Cash out (taxed)'].forEach((s, i) => {
      const q = spring(t - 1.0 - i * 0.18, 260, 24), x = X + i * 500, y = sy + 640 + (1 - q) * 60;
      c.globalAlpha = clamp(q * 2);
      rr(c, x, y, 460, 170, 22); c.fillStyle = '#272a29'; c.fill();
      c.fillStyle = ORANGE; c.font = '900 64px Mont'; c.fillText(String(i + 1), x + 34, y + 104);
      c.fillStyle = '#e9e6df'; c.font = '700 38px Mont'; c.fillText(s, x + 100, y + 100);
      c.globalAlpha = 1;
    });
    c.fillStyle = 'rgba(255,255,255,0.28)'; c.font = '500 26px Mont';
    c.fillText('Design test · options to be verified on canada.ca before publishing', X, sy + sh - 50);
    c.restore();
  });
}

const TAPE_A = [
  ['EXAMPLE CLIENT', '', 0], ['RRSP BALANCE', '300,000.00', 0], ['AGE', '71', 0], ['DEADLINE', 'DEC 31', 0],
  ['MIN. WITHDRAWAL', '[VERIFY]', 1], ['TAX ON IT', '[VERIFY]', 1], ['', '', 3], ['YOU KEEP', '?', 2],
];
// a strip of adding-machine paper; lines printed so far = n (fractional = feeding)
function tape(c, lines, n, w, slotY, x, minLen = 300) {
  const LH = 62, len = Math.max(minLen, n * LH + 90), top = slotY - len, r = rng(5);
  c.save();
  shadowed(c, 30, 10, 14, 0.3, () => {
    c.beginPath(); c.moveTo(x, slotY); c.lineTo(x, top);
    for (let i = 0; i <= 20; i++) c.lineTo(x + (w * i) / 20, top + (i % 2 ? 10 : 0));
    c.lineTo(x + w, slotY); c.closePath(); c.fillStyle = PAPER; c.fill();
  });
  const sh = c.createLinearGradient(x, 0, x + w, 0);
  sh.addColorStop(0, 'rgba(0,0,0,0.06)'); sh.addColorStop(0.15, 'rgba(0,0,0,0)'); sh.addColorStop(0.85, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.07)');
  c.fillStyle = sh; c.fillRect(x, top + 10, w, len - 10);
  const shown = Math.floor(n);
  for (let i = 0; i < shown; i++) {
    const [l, v, kind] = lines[i];
    const y = slotY - (n - i) * LH + 20;
    if (y < top + 30) continue;
    if (kind === 3) { c.save(); c.setLineDash([14, 10]); c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(x + 26, y); c.lineTo(x + w - 26, y); c.stroke(); c.restore(); continue; }
    const ink = kind === 2 ? '#111' : INK;
    c.fillStyle = ink; c.globalAlpha = 0.86 + r() * 0.14;
    c.font = `${kind === 2 ? 700 : 400} ${kind === 2 ? 42 : 33}px Tape`; c.textBaseline = 'middle';
    c.textAlign = 'left'; c.fillText(l, x + 26, y);
    if (v) {
      c.textAlign = 'right';
      c.fillStyle = kind === 1 ? '#c0392b' : kind === 2 ? GREEN : ink;
      c.fillText(v, x + w - 26, y);
    }
    if (kind === 2) { c.globalAlpha = 0.18; c.fillStyle = GREEN; c.fillRect(x + 12, y - 30, w - 24, 60); }
    c.globalAlpha = 1;
  }
  c.restore();
}

function calcDynamic(c, t, n) {
  inObj(c, CALC, () => {
    tape(c, TAPE_A, n, 570, 40, 95);
    // paper roll lip over the slot
    rr(c, 74, 30, 612, 26, 13); c.fillStyle = '#0f1012'; c.fill();
    // LCD
    rr(c, 76, 120, CALC.w - 152, 130, 14);
    const lg = c.createLinearGradient(0, 120, 0, 250); lg.addColorStop(0, '#b9c8a8'); lg.addColorStop(1, '#a3b391'); c.fillStyle = lg; c.fill();
    const val = n >= 2 ? '300,000.00' : '0.';
    c.fillStyle = '#1e2a1b'; c.font = '700 84px Tape'; c.textAlign = 'right'; c.textBaseline = 'middle';
    c.fillText(val, CALC.w - 100, 190);
  });
}

// laser pointer: a red dot with glow and slight hand tremor
function laser(c, x, y, t, on) {
  if (on <= 0) return;
  const jx = Math.sin(t * 13.1) * 2.2 + Math.sin(t * 7.3) * 1.6, jy = Math.cos(t * 11.7) * 2 + Math.sin(t * 5.1) * 1.4;
  x += jx; y += jy;
  c.save(); c.globalAlpha = on; c.globalCompositeOperation = 'lighter';
  const gl = c.createRadialGradient(x, y, 0, x, y, 90);
  gl.addColorStop(0, 'rgba(255,40,30,0.55)'); gl.addColorStop(0.25, 'rgba(255,20,10,0.18)'); gl.addColorStop(1, 'rgba(255,0,0,0)');
  c.fillStyle = gl; c.beginPath(); c.arc(x, y, 90, 0, 7); c.fill();
  c.fillStyle = 'rgba(255,230,220,1)'; c.beginPath(); c.arc(x, y, 9, 0, 7); c.fill();
  c.fillStyle = 'rgba(255,40,30,0.9)'; c.beginPath(); c.arc(x, y, 15, 0, 7); c.fill();
  c.restore();
}

// ---------- shot C: two neighbours ----------
const NB = [
  { x: 1180, rot: -0.018, head: 'NEIGHBOUR A', sub: 'Waits until 71', col: ORANGE,
    lines: [['SALARY', '85,000.00', 0], ['RRSP AT 65', '300,000.00', 0], ['PLAN', 'NONE', 0], ['TAX AT 71+', '[VERIFY]', 1], ['', '', 3], ['KEEPS', '?', 2]] },
  { x: 2200, rot: 0.014, head: 'NEIGHBOUR B', sub: 'Plans from 65', col: GREEN,
    lines: [['SALARY', '85,000.00', 0], ['RRSP AT 65', '300,000.00', 0], ['PLAN', 'FROM 65', 0], ['TAX AT 71+', '[VERIFY]', 1], ['', '', 3], ['KEEPS', '?', 2]] },
];
function shotC(c, t) {
  c.drawImage(WOOD, 0, 0);
  NB.forEach((nb, i) => {
    c.save(); c.translate(nb.x, 0); c.rotate(nb.rot);
    const n = clamp((t - 0.4 - i * 0.25) * 2.2, 0, nb.lines.length);
    tape(c, nb.lines, n, 520, 1560, 0, 470);
    // index card pinned above
    shadowed(c, 30, 10, 16, 0.35, () => { c.fillStyle = '#fffdf6'; c.fillRect(-30, 760, 580, 220); });
    c.fillStyle = nb.col; c.fillRect(-30, 760, 580, 22);
    c.fillStyle = CHAR; c.font = '900 64px Mont'; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillText(nb.head, 0, 868);
    c.fillStyle = '#555'; c.font = '600 48px Hand'; c.fillText(nb.sub, 2, 940);
    c.restore();
  });
  // shared label + difference sticker
  shadowed(c, 30, 8, 14, 0.35, () => { c.beginPath(); c.arc(1950, 1330, 120, 0, 7); c.fillStyle = ORANGE; c.fill(); });
  c.fillStyle = '#fff'; c.font = '900 80px Mont'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('Δ ?', 1950, 1336);
  c.fillStyle = 'rgba(30,20,10,0.75)'; c.font = '800 54px Mont'; c.fillText('SAME SALARY · SAME RRSP · DIFFERENT PLAN', 1950, 640);
}

// ---------- timeline ----------
// A 0–4 wide desk · B 4–9 push in to the tape · C 9–13 two neighbours
const DUR = 13;
function camAB(t) {
  return {
    cx: track(t, [[0, 1920], [4.0, 2880]]),
    cy: track(t, [[0, 1080], [4.0, 1010]]),
    z: track(t, [[0, 0.5], [4.0, 0.98]]) + 0.008 * t,
    rot: track(t, [[0, 0], [4.0, 0.035]]),
  };
}
function lowerThird(t, text, col) {
  const p = spring(t, 220, 26);
  g.save(); g.globalAlpha = clamp(p * 2);
  g.font = '800 34px Mont'; const w = g.measureText(text).width + 70;
  rr(g, 64, OH - 130, w * p, 64, 10); g.fillStyle = 'rgba(26,26,26,0.92)'; g.fill();
  g.fillStyle = col; g.fillRect(64, OH - 130, 10, 64);
  g.save(); rr(g, 64, OH - 130, w * p, 64, 10); g.clip();
  g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.fillText(text, 100, OH - 97); g.restore();
  g.restore();
}

function draw(t) {
  g.save();
  g.fillStyle = '#000'; g.fillRect(0, 0, OW, OH);
  if (t < 9) {
    const cam = camAB(t);
    g.translate(OW / 2, OH / 2); g.scale(cam.z, cam.z); g.rotate(cam.rot); g.translate(-cam.cx, -cam.cy);
    g.drawImage(STATIC, 0, 0);
    tabletScreen(g, t);
    const n = clamp((t - 4.6) * 1.9, 0, TAPE_A.length);
    calcDynamic(g, t, n);
    // laser keys in local object coords
    const pts = [
      [0, toWorld(TABLET, 900, 470)], [1.4, toWorld(TABLET, 940, 520)], [2.4, toWorld(TABLET, 330, 760)],
      [5.2, toWorld(CALC, 380, 40 - 6 * 62 + 20)], [7.4, toWorld(CALC, 380, 40 - 1 * 62 + 20)], [8.2, toWorld(CALC, 560, 190)],
    ];
    const lx = track(t, pts.map(([k, p]) => [k, p[0]]), 60, 15), ly = track(t, pts.map(([k, p]) => [k, p[1]]), 60, 15);
    const on = clamp((t - 0.8) * 3) * (1 - clamp((t - 3.6) * 4)) + clamp((t - 5.0) * 3);
    laser(g, lx, ly, t, clamp(on));
  } else {
    const lt = t - 9;
