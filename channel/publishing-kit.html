ax canada' <750/mo; 'rental income tax canada' ≈3,605/mo (competition 11.3, best opportunity); 'rental property' ≈30,713/mo (+190%); 'real estate tax strategies' ≈5,399/mo → hook on the risk, 'rental income tax' in the title.", "retention": "Hook (0–4 s): 'one deduction can bite you when you sell' open loop ✅. Concrete contrast (wood vs concrete step) at 15 s ✅. Scene changes at 25 s and 38 s reset attention ✅. One worked number ($96,395) shown twice: deducted, then recaptured ✅. Weakest point: 31–37 s (two rules), short and carried by the pin 'CCA $0'.", "_label": "#18 · Rental Property: CCA Trap"}, {"video": {"title": "Year-end moves before December 31", "duration": "69.67 s (1672 frames)", "mp4": "showreel/out/c5/c5-final.mp4 (share copy: c5-share.mp4)"}, "sources": ["CRA — P113 Gifts and Income Tax; line 34900 how to claim (canada.ca) · current · gifts made by Dec 31 count for the year; official receipt required", "CRA — Withdrawing from a TFSA (canada.ca) · current · withdrawals added back to room on January 1 of the following year; 1%/month on excess", "CRA — Participating in your FHSAs (canada.ca) · current · $8,000 room in the year the first FHSA is opened; carryforward up to $8,000; $40,000 lifetime", "ESDC — Canada Education Savings Grant (canada.ca) · current · 20% of the first $2,500 a year ($500); carry-forward up to $1,000 a year; $7,200 lifetime", "CRA — Important dates for RRSPs; RRSP options when you turn 71 (canada.ca) · current · first 60 days of the next year; Dec 31 of the year you turn 71"], "yt": {"titles": ["Do This Before Dec 31: 4 Tax Moves for Canadians (2026)", "4 Money Moves That Expire on December 31 (Canada)", "Year-End Tax Planning Canada: The Dec 31 Checklist"], "description": "Four money moves expire on December 31 in Canada, and one deadline almost everyone gets wrong.\n\n1. Donations: gifts made by December 31 count on this year's return. Keep the official receipt.\n2. TFSA: need money early next year? Withdraw in December. The room comes back January 1, not a whole year later (withdraw in January and you wait until the next January 1).\n3. FHSA: first-time home buyer? Open an FHSA before the year ends, even empty: that starts $8,000 of participation room, and unused room carries forward (up to $8,000).\n4. RESP: contribute $2,500 for a child by December 31 and the basic Canada Education Savings Grant adds $500 for the year (missed years carry forward, max $1,000 of grant a year).\n\nThe myth: the RRSP deadline isn't December 31. Contributions in the first 60 days of the new year still count for this year, unless you turn 71 this year (then it's December 31).\n\nSources: CRA (gifts and income tax, TFSA withdrawals, FHSA participation room, RRSP important dates) and ESDC (CESG), canada.ca. General information, not advice.\n\n#TaxTips #CanadaTax #TFSA", "hashtags": "#TaxTips #CanadaTax #TFSA", "keywords": "year end tax planning canada, year end tax planning, tax planning, tax tips canada, before december 31, tfsa withdrawal timing, fhsa, resp grant, rrsp deadline 2026, canadian taxes, cra", "pinned": "Dec 31 checklist: donations · TFSA withdrawals (room back Jan 1) · open an FHSA ($8,000 room) · RESP $2,500 → $500 grant. RRSP: 60 days into the new year. Which one were you about to miss?", "cta": "Follow Tax Secrets Canada; next: what actually makes CRA review your return."}, "tt": {"caption": "4 money moves that expire on December 31 🇨🇦 and the RRSP deadline almost everyone gets wrong.", "keywords": "year end tax canada · before december 31 · tfsa withdrawal · fhsa · resp grant · rrsp deadline", "hashtags": "#taxtips #canadiantaxes #tfsa #fhsa #personalfinancecanada", "pinned": "Save this for December. (General info, not advice.)", "cta": "Follow for the next one: what makes CRA review your return."}, "ig": {"caption": "4 money moves that expire on December 31. 🇨🇦\n\n1. Donations: give by Dec 31, keep the receipt.\n2. TFSA: withdraw in December → room back Jan 1 (not a year later).\n3. FHSA: open one before year end → $8,000 of room starts.\n4. RESP: $2,500 by Dec 31 → +$500 grant.\n\nMyth: your RRSP deadline is 60 days into the new year (unless you turn 71).\n\nSave this for December.\n\nSource: CRA, ESDC (canada.ca). General info, not advice.", "keywords": "year end tax canada, tfsa, fhsa, resp, rrsp", "hashtags": "#taxtips #canadiantaxes #tfsa #fhsa #resp #personalfinancecanada", "pinned": "Which one is on your list? 📌", "cta": "Save this for December."}, "eng": {"question": "Which of the four were you about to miss?", "save": "The Dec 31 checklist: donations, TFSA timing, FHSA, RESP.", "share": "Parents (RESP), first-time buyers (FHSA), anyone with a TFSA.", "follow": "Verified Canadian tax deadlines from a Winnipeg accountant."}, "seo": {"primary": "year end tax planning canada", "secondary": "year end tax planning (≈3,940/mo, competition 30.5); tax planning (≈17,072/mo, +21.8%); tax tips (≈9,624/mo); tfsa (≈20,925/mo); rrsp (≈5,076/mo); canadian taxes (≈3,954/mo)", "intent": "A Canadian wants a short checklist of what must be done before December 31.", "audience": "Salaried Canadians, parents, first-time buyers, TFSA holders.", "angle": "Four verified moves + one myth, in one minute; long videos (6–28 min) dominate the topic.", "questions": "What should I do before December 31 for taxes in Canada? · When does TFSA room come back? · Should I open an FHSA before year end? · When is the RRSP deadline? · How do I get the RESP grant?"}, "next": [{"topic": "What triggers a CRA review (A4)", "why": "Next in the plan (bridge)", "intent": "cra audit triggers", "hook": "Why did CRA pick YOUR return?", "angle": "Verified CRA review types", "payoff": "What to keep ready"}, {"topic": "Overlooked self-employed expenses (B2)", "why": "In the plan", "intent": "self employed tax deductions canada", "hook": "Expenses freelancers forget to claim.", "angle": "CRA-listed expenses", "payoff": "A checklist"}, {"topic": "New to Canada: first return (G1)", "why": "In the p , "description": "Why did CRA pick your return? CRA publishes the reasons, and there are four.\n\n1. Your return doesn't match a slip: employers and banks send CRA copies of your T4s and T5s, and the matching program compares them with your return.\n2. The deductions and credits you claimed: some get a closer look, so keep the receipts.\n3. Your compliance history: past problems can bring a second look.\n4. Random selection: some returns are picked by chance.\n\nA review is not an audit. CRA reviews about 3 million returns a year, mostly to confirm that income, deductions and credits are reported correctly and can be supported.\n\nIf a letter comes: send what they ask for by the date in the letter, and keep your records for six years.\n\nSource: CRA, How tax returns are selected for review; Types of reviews; Keeping records (canada.ca). General information, not advice.\n\n#CRA #CanadaTax #TaxTips", "hashtags": "#CRA #CanadaTax #TaxTips", "keywords": "cra audit, cra audit triggers, cra red flags, how to respond to cra audit, cra review letter, canada revenue agency, why did cra review my return, cra matching program, canadian tax tips", "pinned": "CRA's own four reasons: a slip that doesn't match, the claims you make, your history, random selection. A review is not an audit. Ever received a CRA review letter?", "cta": "Follow Tax Secrets Canada; next: your first Canadian tax return as a newcomer."}, "tt": {"caption": "Why did CRA pick YOUR return? 🇨🇦 CRA publishes the 4 reasons. (A review is not an audit.)", "keywords": "cra audit triggers · cra red flags · cra review letter · canada taxes", "hashtags": "#cra #canadiantaxes #taxtips #personalfinancecanada #taxseason", "pinned": "Got a CRA letter? Reply by the date in it. (General info, not advice.)", "cta": "Follow for the next one: your first tax return in Canada."}, "ig": {"caption": "Why did CRA pick your return? 🇨🇦 CRA publishes the reasons:\n\n1. Your return doesn't match a slip (T4, T5)\n2. The deductions and credits you claimed\n3. Your compliance history\n4. Random selection\n\nA review is not an audit: CRA reviews about 3 million returns a year. If a letter comes, reply by the date in it, and keep records six years.\n\nSave this for tax season.\n\nSource: CRA (canada.ca). General info, not advice.", "keywords": "cra audit, cra review, canada tax", "hashtags": "#cra #canadiantaxes #taxtips #taxseason #personalfinancecanada #canadatax", "pinned": "Save this for tax season 📌", "cta": "Save this for tax season."}, "eng": {"question": "Have you ever received a CRA review letter?", "save": "The four official reasons + what to do.", "share": "Anyone who just got a CRA letter.", "follow": "CRA rules from CRA's own pages, explained by a Winnipeg accountant."}, "seo": {"primary": "cra audit triggers", "secondary": "cra red flags (≈9,559/mo); cra audit triggers (≈5,403/mo, competition 16.5); cra audit (≈5,116/mo); how to respond to cra audit (≈4,723/mo, competition 9.3); canada revenue agency (≈5,190/mo)", "intent": "A Canadian wants to know why CRA selected their return and whether to worry.", "audience": "Salaried filers, retirees, side-hustlers who received or fear a CRA letter.", "angle": "CRA's own four published reasons instead of speculative red flags; 'a review is not an audit'.", "questions": "Why did CRA review my return? · Is a CRA review an audit? · What triggers a CRA audit? · How long should I keep tax records? · What do I do with a CRA review letter?"}, "next": [{"topic": "New to Canada: first tax return (G1)", "why": "Bridge in this video; next non-B topic in the plan", "intent": "first tax return canada newcomer", "hook": "Your first Canadian tax return: what's different.", "angle": "Verified newcomer rules", "payoff": "Benefits you unlock by filing"}, {"topic": "Benefits newcomers can claim (G4)", "why": "Pairs with G1", "intent": "benefits for newcomers canada", "hook": "New to Canada? Money you may be missing.", "angle": "Verified benefits", "payoff": "A checklist"}, {"topic": "Got a CRA letter? (A5)", "why": "Direct follow-up to this video", "intent": "cra letter what to do", "hook": "Opened a CRA letter? Do this first.", "angle": "Verified CRA steps", "payoff": "Calm action plan"}], "series": "CRA Basics (records → CRA reviews → CRA letters). Playlist: 'Dealing with CRA'.", "research": "- vidIQ (2026-10-08, 25 credits by balance 1,750 → 1,725): keyword research 'cra audit' (CA), top competitor videos (Blueprint 341K / 237K, Next Step Wealth 251K), Shorts outliers (Faris CPA 193K at 50 subscribers), two title scores 95 / 84. See the analysis Artifact.", "retention": "Hook (0–6 s): 'CRA actually publishes the reasons. There are four.' Open loop with a count ✅. Numbered 1–4 + strip ✅. Scene changes at 26 s and 50 s ✅. Reassurance ('not an audit') before the action step ✅. Weakest point: 26–33 s (history), short and carried by the scene change.", "_label": "#20 · Why CRA Reviews"}, {"video": {"title": "YouTube Taxes in Canada: What the CRA Actually Counts (handwritten)", "duration": "59.33 s (1424 frames)", "mp4": "b8/build/b8_final.mp4 (share copy: b8_share.mp4)"}, "sources": ["canada.ca — CRA tax tip \"Are you a social media influencer? Here's what you need to know\" (2023) · current · social-media activity is generally business activity unless it is a personal endeavour; income includes non-monetary receipts (products, clothes, trips, gifts) reported at fair market value; GST/HST registration once taxable supplies exceed $30,000 over four calendar quarters", "canada.ca — Reporting Rules for Digital Platforms; Guidance on the Reporting Rules for Digital Platform Operators (Part XX of the Income Tax Act) · from calendar year 2024 · reporting platform operators report identification and activity information on reportable sellers (sale of goods, services, property rentals) to the CRA by January 31 of the following year, with a copy to each seller", "canada.ca — business income and expenses (T2125; general rule, also used in const TABS=[["yt","YouTube"],["tt","TikTok"],["ig","Instagram"],["eng","Engagement"],["seo","SEO"],["ret","Retention"],["src","Sources & VO"]];
let v=0,tab="yt";
try{const s=JSON.parse(localStorage.getItem("pk")||"{}");if(s.v!=null)v=s.v;if(s.tab)tab=s.tab}catch(e){}
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function fields(c){
 if(tab==="yt")return[["Primary title",c.yt.titles[0]],["Alternative title A",c.yt.titles[1]],["Alternative title B",c.yt.titles[2]],["Description",c.yt.description],["Hashtags",c.yt.hashtags,1],["Keywords / tags",c.yt.keywords,1],["Pinned comment",c.yt.pinned],["CTA",c.yt.cta]];

 if(tab==="ig")return[["Caption",c.ig.caption],["Search keywords",c.ig.keywords,1],["Hashtags",c.ig.hashtags,1],["Pinned comment",c.ig.pinned],["CTA",c.ig.cta]];
 if(tab==="eng")return[["Primary discussion question",c.eng.question],["Save trigger",c.eng.save],["Share trigger",c.eng.share],["Follow reason",c.eng.follow]];
 if(tab==="seo")return[["Primary keyword",c.seo.primary],["Secondary keywords",c.seo.secondary],["Search intent",c.seo.intent],["Search questions",c.seo.questions||""],["Pain / curiosity",c.seo.pain||""],["Target audience",c.seo.audience],["Curiosity angle",c.seo.angle],["Series",c.series],...c.next.map((n,i)=>["Next topic #"+(i+1),n.topic+"\nWhy: "+n.why+"\nIntent: "+n.intent+"\nHook: "+n.hook+"\nAngle: "+n.angle+"\nPayoff: "+n.payoff])];
 if(tab==="ret")return[["Retention analysis",c.retention],["Research notes",c.research]];
 return[["Fact sources",c.sources.map(s=>"• "+s).join("\n")],["Voiceover",c._vo],["Voiceover timecodes",c._votc,1]];
}
function render(){
 const c=D[v];
 document.getElementById("vids").innerHTML=D.map((d,i)=>`<button aria-pressed="${i===v}" data-v="${i}">${esc(d._label)}</button>`).join("");
 document.getElementById("meta").innerHTML=[c.video.duration,"1080×1920","24 fps",c._mp4].map(x=>`<span>${esc(x)}</span>`).join("");
 document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" aria-selected="${k===tab}" data-t="${k}">${l}</button>`).join("");
 document.getElementById("list").innerHTML=fields(c).map(([l,val,m],i)=>`<div class="field"><div class="fh"><span class="fl">${esc(l)}</span><button class="copy" data-i="${i}">Copy</button></div><p class="val${m?" mono":""}" id="f${i}">${esc(val)}</p></div>`).join("");
 try{localStorage.setItem("pk",JSON.stringify({v,tab}))}catch(e){}
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.v!=null){v=+b.dataset.v;render();return}
 if(b.dataset.t){tab=b.dataset.t;render();return}
 if(b.classList.contains("copy")){
  const el=document.getElementById("f"+b.dataset.i),txt=el.textContent;
  const done=()=>{b.textContent="Copied";b.classList.add("ok");setTimeout(()=>{b.textContent="Copy";b.classList.remove("ok")},1500)};
  const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selected — copy";};
  try{navigator.clipboard.writeText(txt).then(done,sel)}catch(err){sel()}
 }
});
render();
