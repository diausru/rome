\n\nDeductible support payments are spousal support (a current or former partner, or your child's other parent, under a court order or written agreement). Parents aren't on that list. Three tax credits CAN include a parent: the Canada caregiver amount (line 30450), medical expenses (line 33199) and the eligible dependant amount (line 30400). The catch: for a parent, the first two require them to be resident in Canada at some point in the year, and the third requires them to live with you.\n\nBringing parents to Canada? Residency depends on the facts. Get professional advice and keep proof of support.\n\nSources: CRA, support payments; lines 30400, 30450, 33199 (canada.ca). $500/month is an example. General information, not tax advice.\n\n#CanadaTax #CRA #PersonalFinanceCanada", "hashtags": "#CanadaTax #CRA #PersonalFinanceCanada", "keywords": "claim parents on taxes canada, sending money to parents tax deductible canada, canada caregiver credit parent, eligible dependant parent canada, medical expenses for parents canada, support payments deduction cra, newcomers canada taxes, taxes in canada", "pinned": "Quick summary: money sent home isn't deductible, but a parent can count for the caregiver amount, medical expenses or the eligible dependant amount if they meet the residency or living-with-you rules. Did your parents ever live with you in Canada, or do they live abroad full-time? That one fact changes the answer.", "cta": "Follow Tax Secrets Canada for the real math behind Canadian tax questions; next: what happens when your parents move here."}, "tt": {"caption": "Sending money to your parents back home? CRA's answer surprises a lot of newcomers. 🇨🇦 Here's what you can (and can't) claim.", "keywords": "sending money home canada taxes · can I claim my parents on taxes canada · parents abroad tax credit · newcomer taxes canada · CRA dependant rules", "hashtags": "#canadiantaxes #personalfinancecanada #newcomerstocanada #cra #immigrantlife", "pinned": "Real question: do you support parents abroad, or have they lived with you here? Tell me which, and I'll tell you which rule applies (general info, not advice).", "cta": "Follow if you support family back home; the next one covers parents moving to Canada."}, "ig": {"caption": "Your parents aren't a tax deduction. But they CAN count for 3 credits, if one condition is met. 🇨🇦\n\nMoney you send home isn't deductible in Canada: deductible support is for a spouse or ex-partner (or your child's other parent) under a court order or written agreement. A parent can count for the Canada caregiver amount, medical expenses or the eligible dependant amount, but the residency and living-with-you rules decide it.\n\nSave this before tax season, and send it to anyone who supports family abroad.\n\nSources: CRA (canada.ca), lines 30400, 30450, 33199. General info, not advice.", "keywords": "send money to parents canada tax, claim parents canada, caregiver credit, newcomers canada, CRA rules", "hashtags": "#canadiantaxes #personalfinancecanada #newcomerstocanada #immigrantsincanada #cra #canadatax", "pinned": "Who here supports parents back home? 🙋 Which country, and did they ever live with you in Canada?", "cta": "Send this to someone who supports family abroad."}, "eng": {"question": "Do your parents live abroad full-time, or have they lived with you in Canada?", "save": "A checklist of exactly which three credits can include a parent and the condition each needs, useful at tax time.", "share": "Newcomers and immigrant families who send money home every month.", "follow": "A real accountant's channel that shows the actual CRA rule and the math, not hype."}, "seo": {"primary": "claim parents on taxes Canada", "secondary": "sending money to parents abroad tax; Canada caregiver credit; eligible dependant; medical expenses for parents; taxes in Canada (vidIQ ≈3.5K/mo); how taxes work in Canada (≈4.9K/mo)", "intent": "A Canadian taxpayer, often a newcomer, wants to know whether supporting parents abroad reduces their tax.", "audience": "Immigrant and newcomer employees aged 25–50 who send money home; families planning to bring parents to Canada.", "angle": "The common belief that 'supporting family is deductible' versus the real CRA rule, plus the residency catch.", "questions": "Can I claim my parents as dependants in Canada? · Is money sent to family abroad tax deductible? · Can I claim medical expenses for my parents back home? · Does the caregiver credit work if my parents live overseas? · Do I need a written agreement to deduct support?", "pain": "Newcomers sending hundreds a month home feel it should count at tax time; fear of missing a credit, or of claiming something CRA later denies."}, "next": [{"topic": "Parents moved to Canada: when do they count for your taxes?", "why": "The direct sequel: residency decides the credits; high newcomer interest (sponsorship news is trending on IG).", "intent": "how residency works for parents living with me", "hook": "Your parents just landed in Canada. Do they change your tax return?", "angle": "Residency is a fact test, not a visa label", "payoff": "A clear list of the facts CRA looks at, plus when to get advice"}, {"topic": "Canada caregiver amount, explained with real numbers", "why": "Low competition (vidIQ competition 15), an evergreen tax-season search", "intent": "who qualifies for the caregiver credit and how much", "hook": "Caring for a parent? There's a credit, but only if…", "angle": "Impairment + income limits", "payoff": "What it's worth on a real return (verified 2026 amounts)"}, {"topic": "Do you have to report money held abroad? (T1135)", "why": "The same newcomer audience; a real compliance risk", "intent": "foreign property reporting Canada", "hook": "Savings back home? CRA may want a form, and the penalty is real.", "angle": "The $100K cost-amount threshold (to be verified)", "payoff": "Who files T1135 and who doesn't"}], "series": "Can You Deduct This? (episode 1). Also fits a 'Newcomer Tax Basi d dollars a month. That's six thousand a year. Can you claim it? In most cases? No. Deductible support goes to a spouse, an ex, or your child's other parent, under a court order or written agreement. Parents aren't on that list. But three tax credits can include a parent. The caregiver amount, if they have an impairment. Medical expenses you pay for them. And the eligible dependant amount, if you're single and they live with you. Now the catch. For a parent, the first two require residence in Canada at some point in the year. Abroad all year, and never lived with you? These generally don't apply. Bringing them here? Residency depends on the facts. Get advice, and keep proof of support. Sending money home is generous. It just isn't a write-off. Follow for the real math.", "_votc": "[00:00.25–00:03.28] You send your parents five hundred dollars a month.\n[00:03.58–00:06.64] That's six thousand a year. Can you claim it?\n[00:07.19–00:09.40] In most cases? No.\n[00:09.95–00:17.14] Deductible support goes to a spouse, an ex, or your child's other parent, under a court order or written agreement.\n[00:17.39–00:19.02] Parents aren't on that list.\n[00:19.57–00:22.29] But three tax credits can include a parent.\n[00:22.54–00:25.44] The caregiver amount, if they have an impairment.\n[00:25.59–00:27.84] Medical expenses you pay for them.\n[00:27.98–00:32.36] And the eligible dependant amount, if you're single and they live with you.\n[00:32.86–00:34.02] Now the catch.\n[00:34.42–00:39.65] For a parent, the first two require residence in Canada at some point in the year.\n[00:39.95–00:44.61] Abroad all year, and never lived with you? These generally don't apply.\n[00:45.11–00:51.80] Bringing them here? Residency depends on the facts. Get advice, and keep proof of support.\n[00:52.30–00:56.42] Sending money home is generous. It just isn't a write-off.\n[00:56.82–00:58.47] Follow for the real math."}, {"video": {"title": "RRSP at 71: the December 31 deadline", "duration": "59.50 s (1428 frames)", "mp4": "showreel/out/e3/e3-final.mp4 (share copy: e3-share.mp4)"}, "sources": ["CRA — RRSP options when you turn 71 / Options for your RRSPs (canada.ca) · current rules · by Dec 31 of the year you turn 71: withdraw, transfer to a RRIF, or buy an annuity; no withholding on direct transfers to a RRIF or on annuity purchases; withdrawals are income", "CRA — Important dates for RRSP, RRIF and RDSP (canada.ca) · current · the year-you-turn-71 deadline", "CRA — Tax rates on withdrawals (canada.ca) · current · withholding 10% / 20% / 30% (Québec 5% / 10% / 15%) by amount", "CRA — Minimum amount from a RRIF; Receiving income from a RRIF (canada.ca) · current · minimum is zero in the setup year; age-72 factor 0.0540; no withholding on the minimum", "CRA — T4040 RRSPs and other registered plans for retirement (canada.ca) · current · a plan that ceases to be an RRSP: the FMV of its property is deemed received (T4RSP box 26)", "Example only: a $300,000 RRSP → $90,000 withheld at 30%; RRIF minimum at 72 = 5.40% × $300,000 = $16,200 (labelled EXAMPLE on screen)"], "yt": {"titles": ["What Happens to Your RRSP at 71? (Don't Miss Dec 31)", "Turning 71? Your RRSP Has a December 31 Deadline", "RRSP to RRIF at 71: 3 Options and How Each Is Taxed"], "description": "Turning 71 this year? Your RRSP has to be closed by December 31: cash it out, buy an annuity, or transfer it to a RRIF.\n\nCash out: the whole amount is income that year, and on a lump sum over $15,000 the issuer withholds 30% (outside Québec). On $300,000 that's $90,000 withheld up front, and it isn't even the final tax. Annuity or RRIF: no tax is withheld on the direct transfer; you're taxed as the payments come in. RRIF withdrawals start the year after; at 72 the minimum is 5.40% of the value (on $300,000: $16,200), with no tax withheld on the minimum, but it's still income.\n\nThe real danger is doing nothing: if the plan no longer qualifies as an RRSP, CRA treats you as having received the full value as income.\n\nChoosing or mixing options depends on your situation. Talk to your issuer and a tax professional.\n\nSources: CRA (canada.ca): RRSP options when you turn 71, Tax rates on withdrawals, Minimum amount from a RRIF, T4040. $300,000 is an example. General information, not tax advice.\n\n#RRSP #RRIF #CanadaTax", "hashtags": "#RRSP #RRIF #CanadaTax", "keywords": "rrsp at 71, what happens to my rrsp at 71, rrsp to rrif, rrif minimum withdrawal, rrsp withdrawal strategy, retirement planning canada, retirement income canada, canadian retirement, CRA rrsp deadline", "pinned": "Quick recap: by Dec 31 of the year you turn 71, an RRSP becomes cash, an annuity or a RRIF (or a mix). Cash out = income now with withholding; annuity/RRIF = no withholding on the transfer, taxed as you're paid. Is someone in your family turning 71 this year? Which option are they leaning toward?", "cta": "Follow Tax Secrets Canada for the real math on retirement taxes; next up: the OAS clawback."}, "tt": {"caption": "Turning 71? Your RRSP has a hard deadline: Dec 31. 🇨🇦 Three options, and one costly mistake.", "keywords": "rrsp at 71 · rrsp to rrif · what happens to rrsp at 71 · rrif minimum withdrawal · retirement taxes canada", "hashtags": "#rrsp #rrif #retirementcanada #canadiantaxes #personalfinancecanada", "pinned": "Send this to a parent or grandparent turning 71 this year. Which option would you pick: cash, annuity or RRIF? (General info, not advice.)", "cta": "Follow for the next one: how the OAS clawback works."}, "ig": {"caption": "Turning 71 this year? Your RRSP has a December 31 deadline. 🇨🇦\n\nBy the end of the year you turn 71, an RRSP must be cashed out, used to buy an annuity, or transferred to a RRIF. Cash out = it's all income that year (30% withheld on a lump sum over $15,000, outside Québec). Annuity or RRIF = no tax withheld on the direct transfer; you're taxed as payments come in. RRIF minimum at 72: 5.40%.\n\nSave this and share it with someone turning 71.\n\nSources: CRA (canada.ca). $300,000 is an example. General info, not advice.", "keywords": "rrsp at 71, rrsp to rrif, rrif minimum, retirement canada, canadian retirement taxes", "hashtags": "#rrsp #rrif #retirementplanning #canadiantaxes #personalfinancecanada #canadatax", "pinned": "Who in your family turns 71 this year? 🙋 Have they picked cash, annuity or RRIF yet?", "cta": "Share this with someone turning 71."}, "eng": {"question": "Is someone in your family turning 71 this year, and which option are they leaning toward?", "save": "The three options and how each is taxed, plus the 5.40% minimum at 72: a checklist before December.", "share": "Adult children with parents near 71; couples planning retirement income.", "follow": "A real accountant's channel with CRA sources on screen; the retirement series continues with OAS, CPP and GIS."}, "seo": {"primary": "RRSP at 71", "secondary": "rrsp to rrif (vidIQ ≈4,756/mo); rrif (≈5,089/mo); rrsp withdrawal strategy (≈4,791/mo); retirement income canada (≈4,414/mo); retirement planning canada (≈3,947/mo); canadian retirement (≈11,614/mo, +29% vs its 30-day baseline)", "intent": "A Canadian approaching 71 (or their adult child) wants to know what must happen to the RRSP and how each choice is taxed.", "audience": "Canadians aged 60–71 with RRSPs and their adult children aged 35–50 who help with finances.", "angle": "A deadline with three exits and one trap; the numbers on $300,000 make the tax difference concrete.", "questions": "What happens to my RRSP at 71? · Do I have to convert my RRSP to a RRIF? · How much tax is withheld if I cash out my RRSP? · What is the RRIF minimum withdrawal at 72? · Is there tax on transferring an RRSP to a RRIF?", "pain": "Fear of a large one-year tax bill; confusion between withholding and final tax; uncertainty about a forced deadline late in the year."}, "next": [{"topic": "OAS clawback: how it works and legal ways to keep more (E2)", "why": "Next in the plan; vidIQ 'oas clawback' ≈5,324/mo, comp ers are publishing 'convert by Dec 31' pieces; the seasonal window is now through December, so publish early in Q4.\n- vidIQ title scores (short-form): 'What Happens to Your RRSP at 71? (Don't Miss Dec 31)' 96; 'Turning 71? Your RRSP Has a December 31 Deadline' 92; 'RRSP to RRIF at 71: 3 Options and How Each Is Taxed' 82.", "retention": "Hook (0–2 s): a personal trigger ('Turning seventy-one?') plus a hard date ✅. Open loop: 'the whole account can hit one tax return' is resolved at the catch (44–52 s) ✅. Information density: 3 options, one tax consequence each, then one number ✅. Visual change rate: a new card or reveal every 2–6 s; the counter and −$90,000 add motion in the cash beat ✅. Escalation: deadline → options → minimum → the real danger ✅. Payoff: one action (choose before Dec 31, get advice) ✅. CTA: soft, 1.4 s ✅. Weakest point: 32–44 s (the RRIF minimum, the longest beat at 12 s); it holds because the 5.40% → $16,200 reveal lands mid-beat. No re-render needed.", "_label": "#3 · RRSP at 71 (Dec 31)", "_mp4": "e3-share.mp4", "_vo": "Turning seventy-one? Your RRSP has a deadline: December thirty-first. Miss it, and the whole account can hit one tax return. One: cash out. On three hundred thousand dollars, it's all income that year, and thirty percent is withheld up front. Two: an annuity. No tax withheld on the transfer; you're taxed as payments come in. Three: move it to a RRIF. No tax withheld on a direct transfer either. Withdrawals start the next year. At seventy-two, the minimum is five point four percent: sixteen thousand two hundred. No tax withheld, but it's still income. The real danger is doing nothing. Miss the deadline, and the full value can be taxed as income. Pick your path before December thirty-first. Talk to your issuer and a pro. Follow for the real math.", "_votc": "[00:00.25–00:06.16] Turning seventy-one? Your RRSP has a deadline: December thirty-first.\n[00:06.44–00:09.91] Miss it, and the whole account can hit one tax return.\n[00:10.27–00:18.36] One: cash out. On three hundred thousand dollars, it's all income that year, and thirty percent is withheld up front.\n[00:18.64–00:25.45] Two: an annuity. No tax withheld on the transfer; you're taxed as payments come in.\n[00:25.69–00:31.75] Three: move it to a RRIF. No tax withheld on a direct transfer either.\n[00:31.99–00:44.27] Withdrawals start the next year. At seventy-two, the minimum is five point four percent: sixteen thousand two hundred. No tax withheld, but it's still income.\n[00:44.63–00:52.01] The real danger is doing nothing. Miss the deadline, and the full value can be taxed as income.\n[00:52.37–00:57.19] Pick your path before December thirty-first. Talk to your issuer and a pro.\n[00:57.43–00:58.81] Follow for the real math."}, {"video": {"title": "OAS clawback: the line, the 15%, and 3 legal levers", "duration": "59.50 s (1428 frames)", "mp4": "showreel/out/e2v2/e2v2-final.mp4 (share copy: e2v2-share.mp4)"}, "sources": ["Service Canada — Old Age Security pension recovery tax; Repayment of OAS pension (canada.ca) · 2026 income year · 15% of net world income above $95,323, recovered from OAS paid July 2027 – June 2028, withheld monthly", "CRA — Pension income splitting (canada.ca) · current rules · up to 50% of eligible pension income; at 65+ includes RRIF and annuity payments; joint election T1032", "CRA — What is a TFSA (canada.ca) · current · TFSA income and withdrawals don't affect federal income-tested benefits such as OAS and GIS", "Service Canada — OAS: when to start your pension (canada.ca) · current · +0.6% per month of deferral, up to 36% at 70; no GIS while delaying", "Example only: $110,000 net income → $14,677 over → $2,201.55 recovered (labelled EXAMPLE on screen)"], "yt": {"titles": ["OAS Clawback 2026: The $95,323 Line (and 3 Legal Ways to Keep More)", "How the OAS Clawback Actually Works in Canada", "Earn Over $95K in Retirement? Your OAS Gets Clawed Back"], "description": "Retired with income over $95,323? Part of your Old Age Security goes back. Here's exactly how much, and three legal levers.\n\nThe OAS recovery tax: for 2026 income, you repay 15% of your net world income above $95,323. Example: net income of $110,000 is $14,677 over the line, so $2,201.55 is recovered, withheld from your OAS payments from July 2027 to June 2028.\n\nThree legal levers:\n1) Pension income splitting: at 65+, up to 50% of eligible pension income (including RRIF and annuity payments) can be allocated to your spouse (joint election, Form T1032).\n2) TFSA withdrawals aren't income, so they don't affect OAS.\n3) Delaying OAS: +0.6% for each month after 65, up to +36% at 70 (you can't get GIS while you delay).\n\nWhich lever fits depends on your whole picture. Talk to a tax professional.\n\nSources: Service Canada, OAS pension recovery tax; CRA, Pension income splitting; What is a TFSA; OAS: when to start (canada.ca). $110,000 is an example. General information, not tax advice.\n\n#OAS #RetirementCanada #CanadaTax", "hashtags": "#OAS #RetirementCanada #CanadaTax", "keywords": "oas clawback, oas clawback 2026, oas recovery tax, old age security clawback threshold, how to avoid oas clawback, pension income splitting canada, retirement income canada, canadian retirement, rrif and oas", "pinned": "Quick recap: for 2026 income the line is $95,323. Above it, 15¢ of OAS per $1 goes back, taken from your OAS starting July 2027. Levers: pension splitting at 65+, TFSA withdrawals, delaying OAS. Are you close to the line, or comfortably under it?", "cta": "Follow Tax Secrets Canada for the real retirement math; next: CPP at 60, 65 or 70."}, "tt": {"caption": "Over $95K in retirement? 🇨🇦 Here's how the OAS clawback really works, and 3 legal ways to keep more.", "keywords": "oas clawback · oas clawback 2026 · old age security recovery tax · retirement taxes canada · pension splitting canada", "hashtags": "#oas #retirementcanada #canadiantaxes #personalfinancecanada #seniorscanada", "pinned": "Which lever would he  until the year the child turns 17; catch-up up to $1,000 a year with unused room", "CRA — Canada Education Savings Grant (canada.ca) · current · repayment of the CESG/CLB if the beneficiary doesn't pursue post-secondary education", "CRA / ESDC — Canada Learning Bond (canada.ca) · current · lower-income families, born 2004+, $500 + $100 a year up to $2,000, no contribution needed", "Example only: $2,500 a year from birth → $500 a year → $7,200 reached in year 15"], "yt": {"titles": ["RESP: Put In $2,500, Get $500 Every Year (Canada)", "The RESP Grant Most Parents Only Half Understand", "RESP Grant Explained: $500 a Year, $7,200 Max, and the Catch"], "description": "Put $2,500 a year into your child's RESP and the government adds $500. That's the Canada Education Savings Grant (CESG): 20% of the first $2,500 contributed each year, up to $7,200 per child, available until the end of the year the child turns 17.\n\nExample: $2,500 a year from birth reaches the full $7,200 grant in year 15.\nMissed years? Unused grant room carries forward: you can get up to $1,000 of grant in one year (a $5,000 contribution).\nLower-income family? The Canada Learning Bond adds up to $2,000 for children born in 2004 or later, with no contribution needed.\n\nThe catch: if your child doesn't go on to post-secondary education, the grant and the bond are repaid to the government.\n\nSources: ESDC and CRA (canada.ca): How much money can be added to RESPs; Canada Education Savings Grant; Canada Learning Bond. The $2,500-a-year plan is an example. General information, not financial advice.\n\n#RESP #CanadaTax #PersonalFinanceCanada", "hashtags": "#RESP #CanadaTax #PersonalFinanceCanada", "keywords": "resp grant, resp canada, canada education savings grant, cesg, canada learning bond, resp catch up, resp for kids, education savings canada, personal finance canada", "pinned": "Recap: 20% of the first $2,500 a year → up to $500, max $7,200 per child. Unused room carries forward (up to $1,000 of grant a year). Lower income: the Canada Learning Bond adds up to $2,000. Did you start your child's RESP at birth, or are you catching up?", "cta": "Follow Tax Secrets Canada for the real math; next: RRSP vs TFSA."}, "tt": {"caption": "Put $2,500 into your kid's RESP and the government adds $500. 🇨🇦 Here's the rest most parents miss.", "keywords": "resp grant · resp canada · cesg · canada learning bond · education savings for kids", "hashtags": "#resp #canadianparents #personalfinancecanada #canadiantaxes #momsofcanada", "pinned": "Did you open an RESP at birth, or are you catching up? (General info, not advice.)", "cta": "Follow for the next one: RRSP vs TFSA."}, "ig": {"caption": "$2,500 in → +$500 from the government. Every year. 🇨🇦\n\nThe Canada Education Savings Grant pays 20% on the first $2,500 you put into an RESP each year, up to $7,200 per child (until the year they turn 17). Missed years? Unused room carries forward (up to $1,000 of grant a year). Lower-income families can also get the Canada Learning Bond: up to $2,000, no contribution needed.\n\nThe catch: no post-secondary → the grant goes back.\n\nSave this and share it with a new parent.\n\nSources: ESDC / CRA (canada.ca). General info, not advice.", "keywords": "resp, resp grant, cesg, canada learning bond, saving for kids canada", "hashtags": "#resp #canadianparents #educationsavings #canadiantaxes #personalfinancecanada #canadatax", "pinned": "New parents 🙋: did you know about the Canada Learning Bond?", "cta": "Share this with a new parent."}, "eng": {"question": "Did you start the RESP at birth, or are you catching up?", "save": "The three numbers ($500 a year, $7,200 max, $1,000 catch-up) plus the CLB, ready for when you open or top up an RESP.", "share": "New and expecting parents; grandparents who want to contribute; newcomer families.", "follow": "A family-money series alongside retirement: RESP → CCB and your income → childcare expenses."}, "seo": {"primary": "RESP grant", "secondary": "canada lls: 'personal finance canada' ≈8,688/mo.\n- Web (2026-10): many 2026 RESP guides (WealthNorth, LiveInCanada, SILaws for newcomers) push '$7,200 free grants'; ESDC published 2026 indexation of the Additional CESG brackets (notice 2025-1114). Angle: complete the picture (cap, catch-up, CLB, repayment) rather than repeat 'free money'.\n- Newcomer families are a strong sub-audience (the CLB and SILaws' newcomer guides).", "retention": "Hook (0–2 s): a concrete in/out ($2,500 → $500) ✅. Open loop: 'Not the rest' pays off through the cap, catch-up, bond and catch ✅. Information density: one number per beat ✅. Visual change rate: labels pinned to the real stacks, a year-by-year counter, the camera on the piggy bank, the family and the cap ✅. Escalation: grant → cap → catch-up → bond → catch ✅. Payoff: an action ('start early, contribute steadily') ✅. Weakest point: 10–19 s (program name + rule); the 20% → $7,200 swap keeps motion. No re-render needed.", "_label": "#6 · RESP Grant + CLB", "_mp4": "d3-share.mp4", "_vo": "Put twenty-five hundred a year into your kid's RESP, and the government adds five hundred. Most parents know that part. Not the rest. It's the Canada Education Savings Grant: twenty percent on the first twenty-five hundred, every year, up to seventy-two hundred per child. Start at birth with twenty-five hundred a year, and you reach the full seventy-two hundred in about fifteen years. Missed a few years? Unused room carries forward. You can catch up, up to a thousand dollars of grant a year. Lower-income family? The Canada Learning Bond adds up to two thousand dollars, and you don't have to contribute a cent. The catch: if your child doesn't go on to post-secondary, the grant money goes back. Start early, contribute steadily, and let the grant do the heavy lifting. Follow for the real math.", "_votc": "[00:00.25–00:06.22] Put twenty-five hundred a year into your kid's RESP, and the government adds five hundred.\n[00:06.50–00:09.63] Most parents know that part. Not the rest.\n[00:09.99–00:18.84] It's the Canada Education Savings Grant: twenty percent on the first twenty-five hundred, every year, up to seventy-two hundred per child.\n[00:19.12–00:27.11] Start at birth with twenty-five hundred a year, and you reach the full seventy-two hundred in about fifteen years.\n[00:27.47–00:35.57] Missed a few years? Unused room carries forward. You can catch up, up to a thousand dollars of grant a year.\n[00:35.85–00:43.77] Lower-income family? The Canada Learning Bond adds up to two thousand dollars, and you don't have to contribute a cent.\n[00:44.13–00:49.85] The catch: if your child doesn't go on to post-secondary, the grant money goes back.\n[00:50.21–00:55.24] Start early, contribute steadily, and let the grant do the heavy lifting.\n[00:55.48–00:56.84] Follow for the real math."}, {"video": {"title": "RRSP vs TFSA: how to decide", "duration": "59.50 s (1428 frames)", "mp4": "showreel/out/d6/d6-final.mp4 (share copy: d6-share.mp4)"}, "sources": ["CRA — MP, DB, RRSP, DPSP, ALDA, TFSA limits (canada.ca) · 2026 · TFSA dollar limit $7,000; RRSP dollar limit $33,810", "CRA — How contributions affect your RRSP deduction limit (canada.ca) · current · 18% of the previous year's earned income up to the annual limit", "CRA — RRSP; Withdrawing from your own RRSPs (canada.ca) · current · deductible contributions; withdrawals are income", "CRA — What is a TFSA; Withdrawing from a TFSA (canada.ca) · current · not deductible; tax-free growth and withdrawals; withdrawn amounts re-added as room on Jan 1 of the next year", "Illustration only: $1,000 of income, money doubles, 30% marginal rate in and out → $1,400 either way; 20% later → RRSP $1,600; 40% later → RRSP $1,200"], "yt": {"titles": ["RRSP or TFSA? One Question Decides It", "RRSP vs TFSA: The Tax Rate Rule (Canada 2026)", "RRSP or TFSA? Same $1,400… Until Your Tax Rate Changes"], "description": "RRSP or TFSA? It isn't about which one is \"better\". It's your tax rate now versus later.\n\nRRSP: contributions are deductible, so you save tax today, but withdrawals are taxed as income.\nTFSA: no deduction going in, but growth and withdrawals are tax-free, and the amount you withdraw comes back as contribution room on January 1 of the next year.\n\nIllustration: $1,000 of income that doubles, at the same 30% rate going in and coming out, leaves $1,400 in either account. A lower rate later (20%) favours the RRSP ($1,600); a higher rate later (40%) favours the TFSA ($1,400 vs $1,200).\n\n2026 limits: TFSA $7,000 (plus unused room); RRSP 18% of last year's earned income, up to $33,810. Check your own room in CRA My Account.\n\nSources: CRA (canada.ca). The example is an illustration. Mechanics only, not investment advice.\n\n#RRSP #TFSA #PersonalFinanceCanada", "hashtags": "#RRSP #TFSA #PersonalFinanceCanada", "keywords": "rrsp vs tfsa, rrsp or tfsa, tfsa limit 2026, rrsp limit 2026, tfsa canada, rrsp canada, tax free savings account, personal finance canada, canadian taxes", "pinned": "Recap: same tax rate in and out → same result. Lower rate later → RRSP ahead. Higher later → TFSA ahead. 2026: TFSA $7,000, RRSP up to $33,810 (18% of last year's earned income). Which way are you leaning, and do you expect your rate to go up or down?", "cta": "Follow Tax Secrets Canada for the real math; next: GIS for low-income seniors."}, "tt": {"caption": "RRSP or TFSA? 🇨🇦 It's not which is better. It's your tax rate now vs later.", "keywords": "rrsp vs tfsa · tfsa limit 2026 · rrsp limit 2026 · canadian savings · tax free savings account", "hashtags": "#rrsp #tfsa #personalfinancecanada #canadiantaxes #moneytips", "pinned": "Expect your tax rate to be higher or lower later? That's your answer. (General info, not advice.)", "cta": "Follow for the next one: GIS for seniors."}, "ig": {"caption": "RRSP or TFSA? One question decides it. 🇨🇦\n\nRRSP: deducted now, taxed when it comes out. TFSA: taxed now, tax-free when it comes out (and the room comes back next year).\nSame tax rate in and out → the same result ($1,000 that doubles → $1,400 either way, at 30%). Lower rate later → RRSP ahead. Higher later → TFSA ahead.\n\n2026 limits: TFSA $7,000 · RRSP 18% of last year's earned income, up to $33,810.\n\nSave this for contribution season.\n\nSource: CRA (canada.ca). Illustration only, not investment advice.", "keywords": "rrsp vs tfsa, tfsa, rrsp, canadian savings, tax tips canada", "hashtags": "#rrsp #tfsa #personalfinancecanada #canadiantaxes #savingmoney #canadatax", "pinned": "RRSP team or TFSA team? 🙋 And why?", "cta": "Save this for contribution season."}, "eng": {"question": "Do you expect your tax rate to be higher or lower in retirement?", "save": "The decision rule plus the 2026 limits, for RRSP season (contributions for 2026 count until early March 2027).", "share": "Young professionals starting to save; couples deciding where to put savings.", "follow": "Mechanics, not hype: the series explains how each account is taxed, with CRA sources."}, "seo": {"primary": "RRSP vs TFSA", "secondary": "rrsp or tfsa; tfsa limit 2026; rrsp limit 2026; tfsa (vidIQ ≈20,925/mo, recorded 2026-10-06 in e3); rrsp (≈5,076/mo); personal finance canada (≈8,688/mo)", "intent": "A Canadian saver wants a simple rule for choosing between an RRSP and a TFSA, plus this year's limits.", "audience": "Employees aged 22–45 starting or growing savings; newcomers learning the accounts.", "angle": "Replace 'which is better' with one question (tax rate now vs later), proven with a small equal-outcome example.", "questions": "Should I put money in an RRSP or a TFSA? · What is the TFSA limit for 2026? · What is the RRSP limit for 2026? · Are TFSA withdrawals taxed? · Do I get TFSA room back after a withdrawal?", "pain": "Fear of picking the 'wrong' account; confusion from conflicting advice online."}, "next": [{"topic": "GIS: the benefit low-income seniors miss (E4)", "why": "Next in the plan; links to 'TFSA withdrawals don't affect GIS'", "intent": "who qualifies for GIS", "hook": "Many low-income seniors qualify for GIS. Are you one?", "angle": "Eligibility and what income counts", "payoff": "How to check and apply"}, {"topic": "What makes an expense deductible (A6)", "why": "Next in the plan; broad audience", "intent": "can I deduct this expense", "hook": "Can you deduct it? CRA asks one question first.", "angle": "Earning income + reasonable + records", "payoff": "A three-question test"}, {"topic": "Records: what to keep and for how long (A7)", "why": "Evergreen; pairs with deductions", "intent": "how long to keep tax records canada", "hook": "Throwing out old receipts? Not so fast.", "angle": "The CRA retention period, verified", "payoff": "A simple keep-list"}], "series": "Savings Mechanics (episode 1: RRSP vs TFSA → FHSA → spousal RRSP later). Playlist: 'Savings Accounts Canada'.", "research": "- vidIQ: credits at 0 until 2026-11-04 → no paid calls. Recorded volumes from the 2026-10-06 pull: 'tfsa' ≈20,925/mo, 'rrsp' ≈5,076/mo, 'rrsp withdrawal strategy' ≈4,791/mo.\n- Web: 'RRSP vs TFSA' is a perennial query; most top results compare features. This Short's angle (one deciding question + an equal-outcome example) is distinct. No creator material copied.\n- Timing: RRSP season (Jan–early Mar) is the seasonal peak; also publish now (evergreen) and re-promote in January.", "retention": "Hook (0–2 s): a common dilemma + 'one question' ✅. Open loop: the question is answered at 9 s, proven by the example at 32–40 s ✅. Information density: two mechanics, one example, one rule, two limits ✅. Visual change rate: the camera moves between the jars, the woman and the skyline; the jar amounts change at each step ✅. Escalation: mechanics → proof → rule → numbers ✅. Payoff: a reframe ✅. Weakest point: 13–31 s (two definition beats); the camera moving jar to jar carries it. No re-render needed.", "_label": "#7 · RRSP vs TFSA", "_mp4": "d6-share.mp4", "_vo": "RRSP or TFSA? One question decides it. It's your tax rate. Now, and later. RRSP: your contribution is deducted now, so you save tax today. But every dollar you take out is taxed as income. TFSA: no deduction going in. But growth and withdrawals are tax-free, and the room comes back the next year. Say you earn a thousand dollars and it doubles. Same tax rate going in and coming out? Both leave you fourteen hundred. Lower rate in retirement? The RRSP comes out ahead. Higher later? The TFSA. Twenty twenty-six limits: seven thousand for the TFSA, up to thirty-three thousand eight hundred ten for the RRSP. So don't ask which is better. Ask which fits your tax rate. Follow for the real math.", "_votc": "[00:00.25–00:04.69] RRSP or TFSA? One question decides it.\n[00:04.97–00:08.46] It's your tax rate. Now, and later.\n[00:08.82–00:18.46] RRSP: your contribution is deducted now, so you save tax today. But every dollar you take out is taxed as income.\n[00:18.75–00:26.74] TFSA: no deduction going in. But growth and withdrawals are tax-free, and the room comes back the next year.\n[00:27.10–00:35.63] Say you earn a thousand dollars and it doubles. Same tax rate going in and coming out? Both leave you fourteen hundred.\n[00:35.91–00:42.98] Lower rate in retirement? The RRSP comes out ahead. Higher later? The TFSA.\n[00:43.34–00:52.54] Twenty twenty-six limits: seven thousand for the TFSA, up to thirty-three thousand eight hundred ten for the RRSP.\n[00:52.90–00:57.18] So don't ask which is better. Ask which fits your tax rate.\n[00:57.42–00:59.04] Follow for the real math."}, {"video": {"title": "GIS: the benefit low-income seniors miss", "duration": "62.50 s (1500 frames)", "mp4": "showreel/out/e4/e4-final.mp4 (share copy: e4-share.mp4)"}, "sources": ["Service Canada — Guaranteed Income Supplement: overview, Do you qualify, How much you could receive (canada.ca) · Oct–Dec 2026 · 65+, receive OAS, live in Canada; single income under $23,112; up to $1,138.90 a month; tax-free; reviewed when you file", "CRA — What is a TFSA (canada.ca) · current · TFSA withdrawals don't reduce the GIS", "canada.ca (Service Canada) · current · the first $5,000 of employment/self-employment income doesn't reduce the GIS; 50% of the next $10,000 is exempt", "Service Canada — OAS: when to start your pension (canada.ca) · current · no GIS while delaying OAS", "ESDC — Take-up rate of the GIS (canada.ca) · 2015 data · about 240,000 eligible seniors didn't receive it (take-up ~89%)"], "yt": {"titles": ["The Benefit 240,000 Canadian Seniors Didn't Claim (GIS)", "GIS Explained: Up to $1,138 a Month for Low-Income Seniors", "Are You Missing the Guaranteed Income Supplement?"], "description": "65 or older on a low income? The Guaranteed Income Supplement (GIS) is a monthly, tax-free payment on top of OAS, and the government's own estimate says about 240,000 eligible seniors didn't receive it in 2015.\n\nFor a single senior (Oct–Dec 2026): up to $1,138.90 a month if your annual income, not counting OAS, is under $23,112. You must receive OAS and live in Canada.\nTFSA withdrawals don't count, and the first $5,000 you earn from work doesn't reduce it.\nThe key: file your taxes every year; that's how eligibility is reviewed. And if you qualify, don't delay OAS: you can't get the GIS while you wait.\n\nCouples have different thresholds. Amounts change every quarter.\n\nSources: Service Canada, ESDC and CRA (canada.ca). General information, not advice.\n\n#GIS #OAS #RetirementCanada", "hashtags": "#GIS #OAS #RetirementCanada", "keywords": "guaranteed income supplement, gis canada, gis eligibility 2026, gis amount, oas and gis, low income seniors canada, seniors benefits canada, retirement income canada", "pinned": "Recap (single, Oct–Dec 2026): up to $1,138.90 a month if income (not counting OAS) is under $23,112. TFSA withdrawals don't count; the first $5,000 of work income doesn't reduce it. File every year. Know someone who should check? Share this with them.", "cta": "Follow Tax Secrets Canada for the real retirement math; next: what makes an expense deductible."}, "tt": {"caption": "65+ on a low income? 🇨🇦 There's a monthly, tax-free payment many seniors miss: the GIS.", "keywords": "gis canada · guaranteed income supplement · seniors benefits canada · oas gis 2026 · low income seniors", "hashtags": "#gis #seniorscanada #retirementcanada #canadiantaxes #personalfinancecanada", "pinned": "Share this with a parent or grandparent who should check. (General info, not advice.)", "cta": "Follow for the next one: what makes an expense deductible."}, "ig": {"caption": "The benefit many low-income seniors miss: the Guaranteed Income Supplement. 🇨🇦\n\nSingle, 65+, receiving OAS, living in Canada, income under $23,112 (not counting OAS)? Up to $1,138.90 a month, tax-free (Oct–Dec 2026). TFSA withdrawals don't count; the first $5,000 from work doesn't reduce it. File your taxes every year, and don't delay OAS if you qualify.\n\nSend this to someone who should check.\n\nSources: Service Canada / ESDC / CRA (canada.ca). General info, not advice.", "keywords": "gis, guaranteed income supplement, seniors canada, oas, retirement benefits", "hashtags": "#gis #seniorscanada #oas #retirementplanning #canadiantaxes #canadatax", "pinned": "Who in your family should check for the GIS? 💛", "cta": "Send this to someone who should check."}, "eng": {"question": "Do you know a senior on a low income who has never checked for the GIS?", "save": "The checklist (OAS, residence, income under $23,112, file every year) for helping a parent.", "share": "Adult children and caregivers of low-income seniors; newcomer families with older parents.", "follow": "Retirement series with CRA/Service Canada sources: RRSP at 71 → OAS clawback → CPP timing → GIS."}, "seo": {"primary": "guaranteed income supplement", "secondary": "gis canada; gis eligibility; gis amount 2026; oas and gis; low income seniors canada; retirement income canada (≈4,414/mo, recorded 2026-10-06)", "intent": "A senior or caregiver wants to know whether they qualify for the  eligibility is reviewed.\n[00:49.36–00:55.41] And if you qualify, don't delay OAS. You can't get GIS while you wait.\n[00:55.77–01:00.00] Know a senior on a low income? Make sure they've checked.\n[01:00.24–01:01.60] Follow for the real math."}, {"video": {"title": "What makes an expense deductible", "duration": "59.79 s (1435 frames)", "mp4": "showreel/out/a6/a6-final.mp4 (share copy: a6-share.mp4)"}, "sources": ["CRA Guide T4002, Chapter 3 (canada.ca) · current · a reasonable current expense incurred to earn business income is deductible; personal expenses aren't; claim only the business part; capital property via CCA", "CRA — Line 8523, Meals and entertainment (canada.ca) · current · generally 50% (exceptions apply)", "CRA Guide T4044 / line 22900 (canada.ca) · current · employees: only expenses the contract required them to pay (Form T2200)", "CRA — Business records (canada.ca) · current · keep records generally six years from the end of the tax year they relate to", "Example only: $1,200 phone bill × 60% business use = $720"], "yt": {"titles": ["Can You Write It Off? CRA's First Question", "Is It Tax Deductible in Canada? The 4-Part Test", "Write-Offs in Canada: What CRA Actually Allows"], "description": "Can you write it off? Before anything else, CRA asks: did you spend it to earn income?\n\nThe general rule (CRA Guide T4002): a reasonable current expense you incur to earn business income is deductible; personal costs are not. Mixed use? Claim only the business part (example: a $1,200 phone bill used 60% for the business = $720).\nSomething that lasts for years, like a laptop or a car, isn't deducted all at once; it's claimed over time through capital cost allowance (CCA).\nBusiness meals and entertainment: generally only 50%.\nOn a salary? You can deduct employment expenses only if your contract requires you to pay them (your employer signs Form T2200).\nAnd keep the proof: records generally for six years.\n\nSources: CRA (canada.ca): T4002, line 8523, T4044, Business records. The phone example is an illustration. General information, not advice.\n\n#CanadaTax #SmallBusinessCanada #SelfEmployed", "hashtags": "#CanadaTax #SmallBusinessCanada #SelfEmployed", "keywords": "tax deductible expenses canada, can i write it off canada, business expenses cra, self employed deductions canada, capital cost allowance, meals and entertainment 50 percent, t2200 employment expenses, cra receipts 6 years", "pinned": "The 4-part test: earn income · reasonable · business part only · keep proof. What's the expense you're never sure about? Drop it below (general info, not advice).", "cta": "Follow Tax Secrets Canada for the real math; next: what records to keep, and for how long."}, "tt": {"caption": "Can you write it off? 🇨🇦 CRA asks one question first. Here's the 4-part test.", "keywords": "write off canada · tax deductible expenses · self employed canada · small business taxes canada · cra rules", "hashtags": "#smallbusinesscanada #selfemployed #canadiantaxes #cra #writeoff", "pinned": "What's the expense you always wonder about? (General info, not advice.)", "cta": "Follow for the next one: what receipts to keep and for how long."}, "ig": {"caption": "Can you write it off? CRA's first question: did you spend it to earn income? 🇨🇦\n\n✓ Reasonable cost to earn business income → deductible. Personal → not.\n✓ Mixed use → the business part only ($1,200 phone × 60% = $720, example).\n✓ Lasts for years → claimed over time (CCA).\n✓ Meals & entertainment → generally 50%.\n✓ Employees → only if your contract requires it (T2200).\n✓ Keep records → generally 6 years.\n\nSave this for tax season.\n\nSource: CRA (canada.ca). General info, not advice.", "keywords": "tax deductions canada, write offs, small business canada, self employed taxes, cra", "hashtags": "#smallbusinesscanada #selfemployedcanada #canadiantaxes #taxtips #entrepreneurcanada #canadatax", "pinned": "Self-employed or salaried? 🙋 Which rule surprised you?", "cta": "Save this for  document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" aria-selected="${k===tab}" data-t="${k}">${l}</button>`).join("");
 document.getElementById("list").innerHTML=fields(c).map(([l,val,m],i)=>`<div class="field"><div class="fh"><span class="fl">${esc(l)}</span><button class="copy" data-i="${i}">Copy</button></div><p class="val${m?" mono":""}" id="f${i}">${esc(val)}</p></div>`).join("");
 try{localStorage.setItem("pk",JSON.stringify({v,tab}))}catch(e){}
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.v!=null){v=+b.dataset.v;render();return}
 if(b.dataset.t){tab=b.dataset.t;render();return}
 if(b.classList.contains("copy")){
  const el=document.getElementById("f"+b.dataset.i),txt=el.textContent;
  const done=()=>{b.textContent="Copied";b.classList.add("ok");setTimeout(()=>{b.textContent="Copy";b.classList.remove("ok")},1500)};
  const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selected — copy";};
  try{navigator.clipboard.writeText(txt).then(done,sel)}catch(err){sel()}
 }
});
render();
</script>
